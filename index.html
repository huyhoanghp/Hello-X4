<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Trắc nghiệm Khung năng lực - Lưu trữ nhiều bộ câu hỏi</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .card-question { transition: all 0.2s ease; }
        .answer-correct { background-color: #dcfce7; border-left: 4px solid #22c55e; }
        .answer-wrong { background-color: #fee2e2; border-left: 4px solid #ef4444; }
        .progress-bar { transition: width 0.3s ease; }
        .toast-notify { position: fixed; bottom: 20px; right: 20px; z-index: 50; }
        .sticky-nav { position: sticky; top: 0; z-index: 40; background: white; }
        .grid-responsive {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 48px));
            gap: 8px;
            justify-content: start;
        }
        @media (max-width: 640px) {
            .container { padding-left: 12px; padding-right: 12px; }
            .sticky-nav { flex-direction: column; align-items: stretch; }
            .option-label { font-size: 0.85rem; }
            .flag-btn, .hint-btn { padding: 4px 6px; font-size: 0.7rem; }
        }
    </style>
</head>
<body class="font-sans antialiased bg-gray-50">

<div class="container mx-auto px-4 py-6 max-w-7xl">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-md p-5 mb-6 border border-gray-100">
        <div class="flex flex-col md:flex-row justify-between items-center gap-3 mb-4">
            <h1 class="text-2xl font-bold text-blue-800 flex items-center gap-2">
                <i class="fas fa-graduation-cap text-blue-600"></i>
                Hello X4
            </h1>
            <div class="flex gap-3">
                <button id="resetExamBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-xl text-sm font-medium"><i class="fas fa-undo-alt mr-1"></i> Làm lại</button>
                <button id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-sm font-medium shadow-sm"><i class="fas fa-check-circle mr-1"></i> Nộp bài</button>
            </div>
        </div>
        
        <!-- Phần quản lý bộ câu hỏi lưu trữ -->
        <div class="bg-gray-50 p-4 rounded-xl mb-4">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[180px]">
                    <label class="block text-sm font-medium text-gray-700 mb-1">📚 Bộ câu hỏi đã lưu</label>
                    <select id="bankSelect" class="w-full border rounded-lg p-2 text-sm bg-white">
                        <option value="">-- Chọn bộ câu hỏi --</option>
                    </select>
                </div>
                <button id="loadSelectedBankBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-folder-open"></i> Tải bộ đã chọn</button>
                <button id="deleteBankBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-trash-alt"></i> Xóa bộ</button>
            </div>
            <div id="currentBankInfo" class="text-xs text-gray-500 mt-2"></div>
        </div>

        <div class="grid md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">📁 Tải file Excel mới (Sheet1)</label>
                <input type="file" id="excelUpload" accept=".xlsx, .xls" class="mt-1 block w-full text-sm">
                <div id="uploadStatus" class="text-xs text-gray-500 mt-1"></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700">📝 Số câu (0 = full)</label>
                    <input type="number" id="questionCount" value="0" min="0" class="w-full border rounded-lg p-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">⏱️ Thời gian (phút)</label>
                    <input type="number" id="timeMinutes" value="30" min="1" class="w-full border rounded-lg p-2 text-sm">
                </div>
            </div>
        </div>
        <div class="flex flex-wrap gap-3 mt-4">
            <button id="startFullTestBtn" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-xl text-sm font-medium"><i class="fas fa-play mr-1"></i> Thi full bài</button>
            <button id="startCustomTestBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-xl text-sm font-medium"><i class="fas fa-sliders-h mr-1"></i> Bắt đầu thi (cấu hình)</button>
            <button id="showGridBtn" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-4 py-2 rounded-xl text-sm"><i class="fas fa-th"></i> Bảng tổng quan</button>
        </div>
        <div id="modeInfo" class="mt-2 text-xs font-medium text-blue-600"></div>
    </div>

    <!-- Thanh tiến độ + tìm kiếm + timer -->
    <div class="sticky-nav bg-white rounded-xl shadow-sm p-4 mb-6 flex flex-wrap md:flex-nowrap justify-between items-center gap-3 border">
        <div class="flex items-center gap-3 flex-shrink-0">
            <i class="fas fa-chart-line text-blue-500 text-xl"></i>
            <div>
                <div class="text-sm font-medium text-gray-600">Tiến độ</div>
                <div class="flex items-center gap-2">
                    <span id="answeredCount" class="text-lg font-bold text-blue-700">0</span>
                    <span class="text-gray-400">/</span>
                    <span id="totalQuestionsCount" class="text-lg font-semibold">0</span>
                </div>
            </div>
        </div>
        <div class="flex-1 w-full min-w-[120px]">
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progressFill" class="progress-bar bg-blue-600 h-2.5 rounded-full" style="width:0%"></div>
            </div>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <div class="relative">
                <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="searchInput" placeholder="Tìm câu..." class="pl-9 pr-3 py-1 border rounded-lg text-sm w-36 md:w-48">
            </div>
            <div id="timerDisplay" class="bg-gray-100 px-3 py-1 rounded-lg font-mono text-lg font-bold text-red-600 whitespace-nowrap">30:00</div>
            <button id="goTopBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded-lg text-sm"><i class="fas fa-arrow-up"></i></button>
            <button id="goBottomBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded-lg text-sm"><i class="fas fa-arrow-down"></i></button>
        </div>
    </div>

    <!-- Bảng tổng quan câu hỏi -->
    <div id="questionGridPanel" class="bg-white rounded-xl shadow-sm p-4 mb-6 hidden border">
        <h3 class="font-semibold text-gray-700 mb-2"><i class="fas fa-table"></i> Tổng quan câu hỏi</h3>
        <div class="overflow-x-auto">
            <div id="questionGrid" class="grid-responsive pb-2"></div>
        </div>
        <div class="text-xs text-gray-500 mt-2 flex gap-4 flex-wrap">
            <span><span class="inline-block w-3 h-3 bg-blue-200 rounded"></span> Chưa làm</span>
            <span><span class="inline-block w-3 h-3 bg-green-500 rounded"></span> Đã làm</span>
            <span><span class="inline-block w-3 h-3 bg-yellow-400 rounded"></span> Đánh dấu</span>
        </div>
    </div>

    <!-- Danh sách câu hỏi -->
    <div id="questionsContainer" class="space-y-5 mb-10"></div>

    <!-- Kết quả -->
    <div id="resultPanel" class="bg-white rounded-xl shadow-md p-5 mt-6 hidden border-t-4 border-blue-400">
        <div class="flex items-center gap-3 mb-3">
            <i class="fas fa-clipboard-list text-blue-600 text-xl"></i>
            <h2 class="text-xl font-bold text-gray-800">📊 Kết quả</h2>
        </div>
        <div id="resultContent" class="text-gray-700 space-y-2"></div>
        <button id="reviewWrongBtn" class="mt-4 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2 rounded-lg text-sm"><i class="fas fa-eye"></i> Xem lại câu sai</button>
    </div>
</div>

<div id="toastMsg" class="toast-notify bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg text-sm hidden"></div>

<script>
    // ------------------- IndexedDB -------------------
    const DB_NAME = 'QuestionBanksDB';
    const STORE_NAME = 'banks';
    let db = null;

    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve(db);
            };
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                }
            };
        });
    }

    async function getAllBanks() {
        if (!db) await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function saveBank(name, questions) {
        if (!db) await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const bank = { name, questions, createdAt: new Date().toISOString() };
            const request = store.add(bank);
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function deleteBank(id) {
        if (!db) await openDB();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const request = store.delete(id);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    // ------------------- State -------------------
    let masterQuestions = [];      // ngân hàng hiện tại
    let currentQuestions = [];     // bộ đang thi
    let userAnswers = [];
    let flagged = [];
    let submitted = false;
    let scoreDetails = [];
    let timerInterval = null;
    let timeRemainingSeconds = 0;
    let examActive = false;
    let currentBankId = null;
    let currentBankName = '';

    // DOM elements
    const bankSelect = document.getElementById('bankSelect');
    const loadSelectedBankBtn = document.getElementById('loadSelectedBankBtn');
    const deleteBankBtn = document.getElementById('deleteBankBtn');
    const currentBankInfo = document.getElementById('currentBankInfo');
    const excelUpload = document.getElementById('excelUpload');
    const startFullTestBtn = document.getElementById('startFullTestBtn');
    const startCustomTestBtn = document.getElementById('startCustomTestBtn');
    const resetExamBtn = document.getElementById('resetExamBtn');
    const submitBtn = document.getElementById('submitBtn');
    const showGridBtn = document.getElementById('showGridBtn');
    const questionCountInput = document.getElementById('questionCount');
    const timeMinutesInput = document.getElementById('timeMinutes');
    const questionsContainer = document.getElementById('questionsContainer');
    const answeredCountSpan = document.getElementById('answeredCount');
    const totalQuestionsSpan = document.getElementById('totalQuestionsCount');
    const progressFill = document.getElementById('progressFill');
    const resultPanel = document.getElementById('resultPanel');
    const resultContent = document.getElementById('resultContent');
    const uploadStatus = document.getElementById('uploadStatus');
    const modeInfo = document.getElementById('modeInfo');
    const reviewWrongBtn = document.getElementById('reviewWrongBtn');
    const goTopBtn = document.getElementById('goTopBtn');
    const goBottomBtn = document.getElementById('goBottomBtn');
    const timerDisplay = document.getElementById('timerDisplay');
    const searchInput = document.getElementById('searchInput');
    const questionGridPanel = document.getElementById('questionGridPanel');
    const questionGrid = document.getElementById('questionGrid');
    const toastMsg = document.getElementById('toastMsg');

    function showToast(msg, duration=2500) {
        toastMsg.innerText = msg;
        toastMsg.classList.remove('hidden');
        setTimeout(() => toastMsg.classList.add('hidden'), duration);
    }

    // Cập nhật dropdown danh sách bộ câu hỏi
    async function refreshBankDropdown() {
        const banks = await getAllBanks();
        bankSelect.innerHTML = '<option value="">-- Chọn bộ câu hỏi --</option>';
        banks.forEach(bank => {
            const option = document.createElement('option');
            option.value = bank.id;
            option.textContent = `${bank.name} (${bank.questions.length} câu)`;
            bankSelect.appendChild(option);
        });
        if (currentBankId) {
            bankSelect.value = currentBankId;
        }
    }

    // Tải một bộ câu hỏi từ ID
    async function loadBankById(id) {
        const banks = await getAllBanks();
        const bank = banks.find(b => b.id == id);
        if (!bank) return false;
        masterQuestions = bank.questions;
        currentBankId = bank.id;
        currentBankName = bank.name;
        currentBankInfo.innerText = `Đã tải: ${bank.name} (${bank.questions.length} câu)`;
        // Reset trạng thái thi
        stopTimer();
        currentQuestions = [];
        userAnswers = [];
        flagged = [];
        submitted = false;
        examActive = false;
        updateProgress();
        renderAllQuestions();
        resultPanel.classList.add('hidden');
        modeInfo.innerText = `Đã tải ngân hàng "${bank.name}". Hãy chọn hình thức thi.`;
        showToast(`Đã tải bộ câu hỏi "${bank.name}"`);
        return true;
    }

    // Xóa bộ câu hỏi
    async function deleteSelectedBank() {
        const id = bankSelect.value;
        if (!id) {
            showToast("Vui lòng chọn bộ cần xóa.");
            return;
        }
        if (confirm("Bạn có chắc chắn muốn xóa bộ câu hỏi này?")) {
            await deleteBank(parseInt(id));
            await refreshBankDropdown();
            if (currentBankId == id) {
                masterQuestions = [];
                currentBankId = null;
                currentBankName = '';
                currentBankInfo.innerText = '';
                stopTimer();
                currentQuestions = [];
                userAnswers = [];
                flagged = [];
                submitted = false;
                examActive = false;
                updateProgress();
                renderAllQuestions();
                resultPanel.classList.add('hidden');
                modeInfo.innerText = '';
                showToast("Đã xóa bộ câu hỏi.");
            } else {
                showToast("Đã xóa bộ câu hỏi.");
            }
        }
    }

    // Upload file và lưu vào DB
    async function uploadAndSaveFile(file) {
        const reader = new FileReader();
        reader.onload = async function(evt) {
            try {
                const data = new Uint8Array(evt.target.result);
                const parsed = parseExcelToQuestions(data);
                if (parsed.length === 0) throw new Error("Không có câu hỏi hợp lệ");
                let bankName = prompt("Nhập tên cho bộ câu hỏi:", file.name.replace(/\.(xlsx|xls)$/i, ''));
                if (!bankName) bankName = file.name;
                await saveBank(bankName, parsed);
                await refreshBankDropdown();
                uploadStatus.innerHTML = `✅ Đã lưu bộ "${bankName}" với ${parsed.length} câu hỏi.`;
                showToast(`Đã lưu bộ "${bankName}"`);
            } catch(err) {
                uploadStatus.innerHTML = `❌ Lỗi: ${err.message}`;
                showToast(err.message);
            }
        };
        reader.readAsArrayBuffer(file);
    }

    // Parse Excel (giữ nguyên)
    function parseExcelToQuestions(dataBuffer) {
        const workbook = XLSX.read(dataBuffer, { type: 'array' });
        let sheet = workbook.Sheets['Sheet1'];
        if (!sheet) sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        if (!rows || rows.length < 2) throw new Error("Sheet không có dữ liệu");
        let headerRowIdx = -1, colMap = { question: -1, answer: -1, type: -1, opt1: -1, opt2: -1, opt3: -1, opt4: -1, opt5: -1 };
        for (let i = 0; i < Math.min(rows.length, 30); i++) {
            const row = rows[i];
            if (!row) continue;
            const rowStr = row.map(c => (c || "").toString().toLowerCase()).join(" ");
            if (rowStr.includes("nội dung câu hỏi")) {
                headerRowIdx = i;
                for (let j = 0; j < row.length; j++) {
                    const cell = row[j] ? row[j].toString().trim() : "";
                    const low = cell.toLowerCase();
                    if (low.includes("nội dung câu hỏi")) colMap.question = j;
                    if (low.includes("đáp án")) colMap.answer = j;
                    if (low.includes("loại câu hỏi")) colMap.type = j;
                    if (low.includes("phương án lựa chọn 1")) colMap.opt1 = j;
                    if (low.includes("phương án lựa chọn 2")) colMap.opt2 = j;
                    if (low.includes("phương án lựa chọn 3")) colMap.opt3 = j;
                    if (low.includes("phương án lựa chọn 4")) colMap.opt4 = j;
                    if (low.includes("phương án lựa chọn 5")) colMap.opt5 = j;
                }
                break;
            }
        }
        if (colMap.question === -1 || colMap.answer === -1) throw new Error("Không tìm thấy cột cần thiết.");
        const qList = [];
        for (let i = headerRowIdx+1; i < rows.length; i++) {
            const row = rows[i];
            if (!row) continue;
            const qText = row[colMap.question] ? row[colMap.question].toString().trim() : "";
            if (!qText) continue;
            let answerRaw = row[colMap.answer] ? row[colMap.answer].toString().trim() : "";
            let ansIdx = answerRaw.split(/[,;]+/).map(s => parseInt(s.trim())).filter(n => !isNaN(n) && n>=1 && n<=5).map(n => n-1);
            let qType = 'single';
            let typeRaw = colMap.type !== -1 && row[colMap.type] ? row[colMap.type].toString().toUpperCase() : "";
            if (typeRaw.includes('MC')) qType = 'multiple';
            else if (typeRaw.includes('SC')) qType = 'single';
            if (qType === 'single' && ansIdx.length > 1) qType = 'multiple';
            const opts = [colMap.opt1, colMap.opt2, colMap.opt3, colMap.opt4, colMap.opt5].map(oc => oc !== -1 && row[oc] ? row[oc].toString().trim() : "").filter(o => o !== "");
            if (opts.length === 0) continue;
            const validIdx = ansIdx.filter(idx => idx >=0 && idx < opts.length);
            if (validIdx.length === 0 && ansIdx.length>0) continue;
            qList.push({ text: qText, options: opts, correctIndices: validIdx, type: qType });
        }
        if (qList.length === 0) throw new Error("Không có câu hỏi hợp lệ");
        return qList;
    }

    // ---------- Các hàm xử lý thi (giữ nguyên từ phiên bản trước) ----------
    function stopTimer() { if (timerInterval) { clearInterval(timerInterval); timerInterval = null; } }
    function startTimer(seconds) {
        stopTimer();
        timeRemainingSeconds = seconds;
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            if (!examActive) return;
            if (timeRemainingSeconds <= 1) {
                stopTimer();
                if (!submitted && currentQuestions.length > 0) {
                    showToast("Hết thời gian! Tự động nộp bài.");
                    submitExam();
                }
            } else {
                timeRemainingSeconds--;
                updateTimerDisplay();
            }
        }, 1000);
    }
    function updateTimerDisplay() {
        const mins = Math.floor(timeRemainingSeconds / 60);
        const secs = timeRemainingSeconds % 60;
        timerDisplay.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        if (timeRemainingSeconds <= 60) timerDisplay.classList.add('text-red-600', 'animate-pulse');
        else timerDisplay.classList.remove('text-red-600', 'animate-pulse');
    }
    function updateProgress() {
        if (!currentQuestions.length) return;
        const answered = userAnswers.filter(ans => ans && ans.length > 0).length;
        answeredCountSpan.innerText = answered;
        totalQuestionsSpan.innerText = currentQuestions.length;
        progressFill.style.width = `${(answered / currentQuestions.length) * 100}%`;
        if (!questionGridPanel.classList.contains('hidden')) renderQuestionGrid();
    }
    function initExam(questionsArray, timeMinutes) {
        if (questionsArray.length === 0) { showToast("Chưa có ngân hàng câu hỏi."); return false; }
        stopTimer();
        currentQuestions = [...questionsArray];
        userAnswers = new Array(currentQuestions.length).fill().map(() => []);
        flagged = new Array(currentQuestions.length).fill(false);
        submitted = false;
        scoreDetails = [];
        examActive = true;
        updateProgress();
        renderAllQuestions();
        resultPanel.classList.add('hidden');
        searchInput.value = '';
        startTimer(timeMinutes * 60);
        modeInfo.innerText = `Đang thi: ${currentQuestions.length} câu, thời gian ${timeMinutes} phút`;
        showToast(`Bắt đầu thi với ${currentQuestions.length} câu.`);
        renderQuestionGrid();
        return true;
    }
    function startFullTest() {
        if (masterQuestions.length === 0) { showToast("Chưa có bộ câu hỏi nào được tải."); return; }
        const time = parseInt(timeMinutesInput.value) || 30;
        initExam(masterQuestions, time);
    }
    function startCustomTest() {
        if (masterQuestions.length === 0) { showToast("Chưa có bộ câu hỏi nào được tải."); return; }
        let num = parseInt(questionCountInput.value);
        if (isNaN(num) || num <= 0) num = masterQuestions.length;
        if (num > masterQuestions.length) num = masterQuestions.length;
        const shuffled = [...masterQuestions];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const selected = shuffled.slice(0, num);
        const time = parseInt(timeMinutesInput.value) || 30;
        initExam(selected, time);
    }
    function resetCurrentExam() {
        if (!currentQuestions.length) { showToast("Chưa có bài thi."); return; }
        if (!examActive) return;
        stopTimer();
        userAnswers = new Array(currentQuestions.length).fill().map(() => []);
        flagged = new Array(currentQuestions.length).fill(false);
        submitted = false;
        scoreDetails = [];
        updateProgress();
        renderAllQuestions();
        resultPanel.classList.add('hidden');
        const mins = parseInt(timeMinutesInput.value) || 30;
        startTimer(mins * 60);
        showToast("Đã làm mới bài làm.");
    }
    function submitExam() {
        if (!currentQuestions.length) { showToast("Chưa có bài thi."); return; }
        if (submitted) { showToast("Bài đã nộp rồi."); return; }
        stopTimer();
        examActive = false;
        submitted = true;
        const evalRes = evaluateAll();
        scoreDetails = evalRes.details;
        const percent = (evalRes.correctCount / evalRes.total * 100).toFixed(1);
        resultContent.innerHTML = `
            <div class="bg-gray-50 p-3 rounded-lg">
                <p class="text-lg font-semibold">✅ Điểm số: ${evalRes.correctCount} / ${evalRes.total} (${percent}%)</p>
                <p class="text-sm text-gray-600">Đúng: ${evalRes.correctCount} | Sai: ${evalRes.total - evalRes.correctCount}</p>
                <div class="w-full bg-gray-200 rounded-full h-2 mt-2"><div class="bg-green-500 h-2 rounded-full" style="width: ${percent}%"></div></div>
            </div>
            <div class="mt-3 text-sm text-gray-500 italic">💡 Kết quả chi tiết từng câu hiển thị bên dưới.</div>
        `;
        resultPanel.classList.remove('hidden');
        renderAllQuestions();
        resultPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function evaluateAll() {
        let correctCount = 0;
        const details = [];
        for (let i = 0; i < currentQuestions.length; i++) {
            const res = checkAnswer(i);
            details.push({ index: i, correct: res.correct, correctIndices: res.correctAnswers, userIndices: res.userAnswers });
            if (res.correct) correctCount++;
        }
        return { correctCount, total: currentQuestions.length, details };
    }
    function checkAnswer(idx) {
        const q = currentQuestions[idx];
        const standard = q.correctIndices;
        const user = userAnswers[idx] || [];
        const isCorrect = standard.length === user.length && standard.every(v => user.includes(v));
        return { correct: isCorrect, correctAnswers: standard, userAnswers: user };
    }
    function setAnswer(qIndex, selectedIndices) {
        if (submitted) { showToast("Đã nộp bài."); return false; }
        userAnswers[qIndex] = [...selectedIndices];
        updateProgress();
        renderSingleQuestion(qIndex);
        renderQuestionGrid();
        return true;
    }
    function toggleFlag(qIndex) {
        if (submitted) { showToast("Đã nộp bài."); return; }
        flagged[qIndex] = !flagged[qIndex];
        renderSingleQuestion(qIndex);
        renderQuestionGrid();
        showToast(flagged[qIndex] ? "Đã đánh dấu câu hỏi." : "Bỏ đánh dấu.");
    }
    function showHint(qIndex) {
        const q = currentQuestions[qIndex];
        const correctText = q.correctIndices.map(i => q.options[i]).join('; ');
        alert(`💡 Đáp án đúng: ${correctText}`);
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    function generateQuestionHTML(idx) {
        const q = currentQuestions[idx];
        const userChoice = userAnswers[idx] || [];
        const isSubmitted = submitted;
        const checkRes = isSubmitted ? checkAnswer(idx) : null;
        const isCorrect = isSubmitted ? checkRes.correct : false;
        const correctIndices = isSubmitted ? checkRes.correctAnswers : [];
        let cardClass = "card-question bg-white rounded-xl shadow-md overflow-hidden border-l-4 ";
        cardClass += isSubmitted ? (isCorrect ? "answer-correct" : "answer-wrong") : "border-gray-200";
        let optionsHtml = '';
        q.options.forEach((opt, optIdx) => {
            const isChecked = userChoice.includes(optIdx);
            const inputType = q.type === 'multiple' ? 'checkbox' : 'radio';
            const nameAttr = `q${idx}`;
            let optionExtraClass = "";
            let showCorrectBadge = false;
            if (isSubmitted && correctIndices.includes(optIdx)) {
                optionExtraClass = "bg-green-100 border-green-300";
                showCorrectBadge = true;
            } else if (isSubmitted && isChecked && !correctIndices.includes(optIdx)) {
                optionExtraClass = "bg-red-100 border-red-300";
            }
            const disabledAttr = isSubmitted ? "disabled" : "";
            const checkedAttr = isChecked ? "checked" : "";
            optionsHtml += `
                <label class="flex items-start gap-3 p-3 rounded-lg border ${optionExtraClass} hover:bg-gray-50 transition cursor-pointer mb-2">
                    <input type="${inputType}" name="${nameAttr}" value="${optIdx}" ${checkedAttr} ${disabledAttr} class="mt-1 option-input" data-qidx="${idx}" data-optidx="${optIdx}">
                    <span class="text-gray-700 text-sm flex-1">${escapeHtml(opt)}</span>
                    ${showCorrectBadge ? '<span class="text-green-600 text-xs font-medium bg-white px-2 py-0.5 rounded-full shadow-sm">✓ Đáp án đúng</span>' : ''}
                </label>
            `;
        });
        let feedbackNote = '';
        if (isSubmitted && !isCorrect) {
            const correctText = correctIndices.map(i => q.options[i] ? q.options[i] : `PA ${i+1}`).join('; ');
            feedbackNote = `<div class="mt-3 text-sm bg-amber-50 p-2 rounded-lg text-amber-800"><i class="fas fa-info-circle"></i> Đáp án đúng: ${escapeHtml(correctText)}</div>`;
        } else if (isSubmitted && isCorrect) {
            feedbackNote = `<div class="mt-3 text-sm text-green-700"><i class="fas fa-check-circle"></i> Chính xác!</div>`;
        }
        const flagIcon = flagged[idx] ? '<i class="fas fa-flag text-yellow-500"></i>' : '<i class="far fa-flag text-gray-400"></i>';
        return `
            <div id="question-${idx}" class="${cardClass}">
                <div class="p-5">
                    <div class="flex justify-between items-start gap-2 flex-wrap">
                        <h3 class="font-semibold text-gray-800 text-base flex gap-2 flex-wrap">
                            <span class="bg-blue-100 text-blue-800 rounded-full w-6 h-6 inline-flex items-center justify-center text-xs font-bold">${idx+1}</span>
                            <span>${escapeHtml(q.text)}</span>
                        </h3>
                        <div class="flex gap-2">
                            <button class="hint-btn text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded" data-qidx="${idx}"><i class="fas fa-lightbulb"></i> Hint</button>
                            <button class="flag-btn text-sm" data-qidx="${idx}">${flagIcon}</button>
                        </div>
                    </div>
                    <div class="mt-3 space-y-1">${optionsHtml}</div>
                    ${feedbackNote}
                </div>
            </div>
        `;
    }
    function renderAllQuestions() {
        if (!currentQuestions.length) {
            questionsContainer.innerHTML = `<div class="text-center text-gray-400 py-10">Chưa có bài thi. Hãy chọn bộ câu hỏi và bắt đầu thi.</div>`;
            return;
        }
        let filterText = searchInput.value.trim().toLowerCase();
        let html = '';
        for (let i = 0; i < currentQuestions.length; i++) {
            if (filterText && !currentQuestions[i].text.toLowerCase().includes(filterText)) continue;
            html += generateQuestionHTML(i);
        }
        if (html === '') html = '<div class="text-center text-gray-400 py-10">Không tìm thấy câu hỏi phù hợp.</div>';
        questionsContainer.innerHTML = html;
        attachAllEvents();
    }
    function renderSingleQuestion(idx) {
        const oldDiv = document.getElementById(`question-${idx}`);
        if (oldDiv) {
            const newHtml = generateQuestionHTML(idx);
            const temp = document.createElement('div');
            temp.innerHTML = newHtml;
            const newDiv = temp.firstElementChild;
            oldDiv.parentNode.replaceChild(newDiv, oldDiv);
            attachEventsForQuestion(idx);
        }
    }
    function attachEventsForQuestion(qIdx) {
        const container = document.getElementById(`question-${qIdx}`);
        if (!container) return;
        const inputs = container.querySelectorAll('.option-input');
        inputs.forEach(input => {
            input.removeEventListener('change', handleInputChange);
            input.addEventListener('change', handleInputChange);
        });
        const flagBtn = container.querySelector('.flag-btn');
        if (flagBtn) {
            flagBtn.removeEventListener('click', flagClickHandler);
            flagBtn.addEventListener('click', flagClickHandler);
        }
        const hintBtn = container.querySelector('.hint-btn');
        if (hintBtn) {
            hintBtn.removeEventListener('click', hintClickHandler);
            hintBtn.addEventListener('click', hintClickHandler);
        }
    }
    function handleInputChange(e) {
        const input = e.target;
        const qIdx = parseInt(input.dataset.qidx);
        const container = document.getElementById(`question-${qIdx}`);
        const allInputs = container.querySelectorAll(`.option-input[name="q${qIdx}"]`);
        let selected = [];
        allInputs.forEach(inp => { if (inp.checked) selected.push(parseInt(inp.dataset.optidx)); });
        setAnswer(qIdx, selected);
    }
    function flagClickHandler(e) {
        const btn = e.currentTarget;
        const qIdx = parseInt(btn.dataset.qidx);
        toggleFlag(qIdx);
    }
    function hintClickHandler(e) {
        const btn = e.currentTarget;
        const qIdx = parseInt(btn.dataset.qidx);
        showHint(qIdx);
    }
    function attachAllEvents() {
        for (let i = 0; i < currentQuestions.length; i++) attachEventsForQuestion(i);
    }
    function renderQuestionGrid() {
        if (!currentQuestions.length) {
            questionGrid.innerHTML = '<div class="text-gray-400">Chưa có dữ liệu</div>';
            return;
        }
        let gridHtml = '';
        for (let i = 0; i < currentQuestions.length; i++) {
            const answered = userAnswers[i] && userAnswers[i].length > 0;
            let bgClass = 'bg-blue-200';
            if (answered) bgClass = 'bg-green-500';
            if (flagged[i]) bgClass = 'bg-yellow-400';
            gridHtml += `<div class="question-grid-item w-10 h-10 rounded-md flex items-center justify-center text-xs font-bold text-white ${bgClass} shadow-sm" data-qidx="${i}">${i+1}</div>`;
        }
        questionGrid.innerHTML = gridHtml;
        document.querySelectorAll('.question-grid-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.qidx);
                const target = document.getElementById(`question-${idx}`);
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                questionGridPanel.classList.add('hidden');
            });
        });
    }

    // ---------- Khởi tạo và gán sự kiện ----------
    async function init() {
        await openDB();
        await refreshBankDropdown();
        // Nếu có bộ nào trong dropdown thì tự động tải bộ đầu tiên? Có thể để người dùng chọn.
        // Không tự động tải để tránh làm mất trạng thái.
    }

    excelUpload.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        uploadAndSaveFile(file);
        excelUpload.value = ''; // cho phép upload lại cùng file
    });

    loadSelectedBankBtn.addEventListener('click', async () => {
        const id = bankSelect.value;
        if (!id) { showToast("Vui lòng chọn bộ câu hỏi."); return; }
        await loadBankById(parseInt(id));
    });

    deleteBankBtn.addEventListener('click', deleteSelectedBank);

    startFullTestBtn.addEventListener('click', startFullTest);
    startCustomTestBtn.addEventListener('click', startCustomTest);
    resetExamBtn.addEventListener('click', resetCurrentExam);
    submitBtn.addEventListener('click', () => { if (currentQuestions.length && !submitted) submitExam(); else showToast("Chưa có bài hoặc đã nộp."); });
    showGridBtn.addEventListener('click', () => { if (currentQuestions.length) { questionGridPanel.classList.toggle('hidden'); if (!questionGridPanel.classList.contains('hidden')) renderQuestionGrid(); } else showToast("Chưa có bài thi."); });
    goTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    goBottomBtn.addEventListener('click', () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }));
    searchInput.addEventListener('input', () => renderAllQuestions());
    reviewWrongBtn.addEventListener('click', () => {
        if (!submitted || scoreDetails.length===0) { showToast("Hãy nộp bài trước."); return; }
        const wrongs = scoreDetails.filter(d => !d.correct).map(d => d.index);
        if (wrongs.length===0) { showToast("Toàn bộ đúng!"); return; }
        const first = document.getElementById(`question-${wrongs[0]}`);
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    init();
</script>
</body>
</html>
