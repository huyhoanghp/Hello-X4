<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Trắc nghiệm Khung năng lực - Bản tối ưu</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background-color: #f3f4f6; color: #111827; transition: all 0.2s; }
        body.dark { background-color: #0f172a; color: #e2e8f0; }
        body.dark .bg-white, body.dark .bg-gray-50, body.dark .sticky-nav, body.dark .card-question {
            background-color: #1e293b !important; color: #e2e8f0 !important; border-color: #334155 !important;
        }
        body.dark .border-gray-200, body.dark .border-gray-100 { border-color: #334155 !important; }
        body.dark .bg-gray-100, body.dark .bg-gray-200 { background-color: #0f172a !important; }
        body.dark .text-gray-700, body.dark .text-gray-600, body.dark .text-gray-500,
        body.dark .text-gray-800, body.dark .text-black { color: #cbd5e1 !important; }
        body.dark input, body.dark select, body.dark .border {
            background-color: #0f172a !important; color: #e2e8f0 !important; border-color: #475569 !important;
        }
        
        /* Cải thiện hiển thị Bảng Kết quả trong chế độ tối */
        body.dark #resultContent { color: #e2e8f0; }
        body.dark #resultContent .bg-gray-50 { background-color: #1e293b !important; border: 1px solid #475569; }
        body.dark #resultContent .text-gray-800 { color: #f8fafc !important; }
        body.dark #resultContent .text-gray-700 { color: #cbd5e1 !important; }
        body.dark #resultContent .bg-gray-200 { background-color: #334155 !important; }

        body.dark mark { background-color: #b45309 !important; color: #fff !important; } /* Highlight trong chế độ tối */

        .card-question { transition: all 0.2s ease; content-visibility: auto; contain-intrinsic-size: auto 200px; }
        .answer-correct { background-color: #dcfce7; border-left: 4px solid #22c55e; }
        .answer-wrong { background-color: #fee2e2; border-left: 4px solid #ef4444; }
        body.dark .answer-correct { background-color: #064e3b !important; border-left-color: #4ade80; }
        body.dark .answer-wrong { background-color: #7f1d1d !important; border-left-color: #f87171; }
        .progress-bar { transition: width 0.3s ease; }
        .toast-notify { position: fixed; bottom: 20px; right: 20px; z-index: 60; background: #1f2937; color: white; padding: 0.75rem 1rem; border-radius: 0.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 90vw; }
        .sticky-nav { position: sticky; top: 0; z-index: 40; background: white; }
        .grid-responsive { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 48px)); gap: 8px; justify-content: start; }
        @media (max-width: 640px) { .container { padding-left: 12px; padding-right: 12px; } .sticky-nav { flex-direction: column; align-items: stretch; } }
        .wrong-table th, .wrong-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        body.dark .wrong-table th, body.dark .wrong-table td { border-color: #475569; }
        .wrong-table th { background-color: #f2f2f2; }
        body.dark .wrong-table th { background-color: #334155; }
        
        /* Modal Custom CSS cho Dark Mode */
        body.dark #customModalContent { background-color: #1e293b; border-color: #475569; }
        body.dark #customModalText { color: #cbd5e1; }
        body.dark #customModalCancel { background-color: #334155; color: #e2e8f0; }
        body.dark #customModalCancel:hover { background-color: #475569; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; display: none; justify-content: center; align-items: center; flex-direction: column; color: white; font-size: 1.2rem; backdrop-filter: blur(3px); }
        .spinner { border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 4px solid white; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="font-sans antialiased bg-gray-100">
<div id="loadingOverlay"><div class="spinner"></div><div>Đang xử lý, vui lòng chờ...</div></div>

<div class="container mx-auto px-4 py-6 max-w-7xl">
    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-md p-5 mb-6 border border-gray-200">
        <div class="flex flex-col md:flex-row justify-between items-center gap-3 mb-4">
            <h1 class="text-2xl font-bold text-blue-800 flex items-center gap-2"><i class="fas fa-graduation-cap text-blue-600"></i> Hello X4</h1>
            <div class="flex gap-3">
                <button id="darkModeToggle" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-2 rounded-xl text-sm"><i class="fas fa-moon"></i> <span id="darkModeText">Tối</span></button>
                <button id="pauseResumeBtn" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-xl text-sm font-medium"><i class="fas fa-pause"></i> Tạm dừng</button>
                <button id="resetExamBtn" class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-xl text-sm"><i class="fas fa-undo-alt mr-1"></i> Làm lại</button>
                <button id="submitBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-sm shadow-sm"><i class="fas fa-check-circle mr-1"></i> Nộp bài</button>
            </div>
        </div>
        <div class="bg-gray-50 p-4 rounded-xl mb-4">
            <div class="flex flex-wrap gap-4 items-end">
                <div class="flex-1 min-w-[180px]"><label class="block text-sm font-medium text-gray-700 mb-1">📚 Bộ câu hỏi đã lưu</label><select id="bankSelect" class="w-full border rounded-lg p-2 text-sm bg-white"><option value="">-- Chọn bộ câu hỏi --</option></select></div>
                <button id="loadSelectedBankBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-folder-open"></i> Tải bộ</button>
                <button id="deleteBankBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-trash-alt"></i> Xóa bộ</button>
                <button id="showStatsBtn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-chart-line"></i> Báo cáo chi tiết</button>
            </div>
            <div id="currentBankInfo" class="text-xs text-gray-500 mt-2"></div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
            <div><label class="block text-sm font-medium text-gray-700">📁 Tải file Excel mới (Sheet1)</label><input type="file" id="excelUpload" accept=".xlsx, .xls" class="mt-1 block w-full text-sm border rounded-lg p-2 bg-white"><div id="uploadStatus" class="text-xs text-gray-500 mt-1"></div></div>
            <div class="grid grid-cols-2 gap-3"><div><label class="block text-sm font-medium text-gray-700">📝 Số câu (0 = full)</label><input type="number" id="questionCount" value="0" min="0" class="w-full border rounded-lg p-2 text-sm bg-white"></div><div><label class="block text-sm font-medium text-gray-700">⏱️ Thời gian (phút)</label><input type="number" id="timeMinutes" value="30" min="1" class="w-full border rounded-lg p-2 text-sm bg-white"></div></div>
        </div>
        <div class="flex flex-wrap gap-3 mt-4">
            <button id="startFullTestBtn" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-xl text-sm"><i class="fas fa-play mr-1"></i> Thi full bài</button>
            <button id="startRandomTestBtn" class="bg-purple-600 hover:bg-purple-700 text-white px-5 py-2 rounded-xl text-sm"><i class="fas fa-random mr-1"></i> Thi ngẫu nhiên</button>
            <button id="reviewWrongMainBtn" class="bg-orange-500 hover:bg-orange-600 text-white px-5 py-2 rounded-xl text-sm"><i class="fas fa-book-open mr-1"></i> Ôn câu sai</button>
            <button id="showGridBtn" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-4 py-2 rounded-xl text-sm"><i class="fas fa-th"></i> Bảng tổng quan</button>
        </div>
        <div id="modeInfo" class="mt-2 text-xs font-medium text-blue-600"></div>
    </div>

    <div class="sticky-nav bg-white rounded-xl shadow-sm p-4 mb-6 flex flex-wrap md:flex-nowrap justify-between items-center gap-3 border border-gray-200">
        <div class="flex items-center gap-3 flex-shrink-0"><i class="fas fa-chart-line text-blue-500 text-xl"></i><div><div class="text-sm font-medium text-gray-600">Tiến độ</div><div class="flex items-center gap-2"><span id="answeredCount" class="text-lg font-bold text-blue-700">0</span><span class="text-gray-400">/</span><span id="totalQuestionsCount" class="text-lg font-semibold">0</span></div></div></div>
        <div class="flex-1 w-full min-w-[120px]"><div class="w-full bg-gray-200 rounded-full h-2.5"><div id="progressFill" class="progress-bar bg-blue-600 h-2.5 rounded-full" style="width:0%"></div></div></div>
        <div class="flex items-center gap-2 flex-wrap">
            <div class="relative group flex items-center">
                <i class="fas fa-search absolute left-3 text-gray-400 text-sm pointer-events-none"></i>
                <input type="text" id="searchInput" placeholder="Tìm câu..." title="Tìm kiếm không liền mạch (VD: câu zone)" class="pl-9 pr-8 py-1.5 border rounded-lg text-sm w-40 md:w-56 bg-white focus:outline-none focus:ring-2 focus:ring-blue-400">
                <button id="clearSearchBtn" class="absolute right-2 text-gray-400 hover:text-gray-600 hidden outline-none">
                    <i class="fas fa-times-circle"></i>
                </button>
            </div>
            <div id="timerDisplay" class="bg-gray-100 px-3 py-1 rounded-lg font-mono text-lg font-bold text-red-600 whitespace-nowrap">30:00</div>
            <button id="goTopBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded-lg text-sm"><i class="fas fa-arrow-up"></i></button>
            <button id="goBottomBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-2 py-1 rounded-lg text-sm"><i class="fas fa-arrow-down"></i></button>
        </div>
    </div>

    <div id="questionGridPanel" class="bg-white rounded-xl shadow-sm p-4 mb-6 hidden border border-gray-200"><h3 class="font-semibold text-gray-700 mb-2"><i class="fas fa-table"></i> Tổng quan câu hỏi</h3><div class="overflow-x-auto"><div id="questionGrid" class="grid-responsive pb-2"></div></div><div class="text-xs text-gray-500 mt-2 flex gap-4 flex-wrap"><span><span class="inline-block w-3 h-3 bg-blue-200 rounded"></span> Chưa làm</span><span><span class="inline-block w-3 h-3 bg-green-500 rounded"></span> Đã làm</span><span><span class="inline-block w-3 h-3 bg-yellow-400 rounded"></span> Đánh dấu</span></div></div>
    
    <!-- Render Container -->
    <div id="questionsContainer" class="space-y-5 mb-10"></div>
    <div id="loadMoreTrigger" class="h-10 w-full"></div> <!-- Dùng cho Intersection Observer -->

    <div id="resultPanel" class="bg-white rounded-xl shadow-md p-5 mt-6 hidden border-t-4 border-blue-400">
        <div class="flex justify-between items-center mb-3">
            <div class="flex items-center gap-3">
                <i class="fas fa-clipboard-list text-blue-600 text-xl"></i>
                <h2 class="text-xl font-bold text-gray-800">📊 Kết quả</h2>
            </div>
            <button id="exportPdfBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-file-pdf"></i> Xuất Báo Cáo</button>
        </div>
        <div id="resultContent" class="text-gray-700 space-y-2"></div>
        <button id="reviewWrongBtn" class="mt-4 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-4 py-2 rounded-lg text-sm"><i class="fas fa-eye"></i> Xem lại câu sai</button>
    </div>

    <div id="statsModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4"><div class="bg-white rounded-2xl max-w-6xl w-full max-h-[90vh] overflow-y-auto p-6"><div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold text-gray-800">📈 Báo cáo lịch sử học tập</h2><div><button id="clearHistoryBtn" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded-lg text-sm mr-2"><i class="fas fa-trash-alt"></i> Xóa lịch sử</button><button id="closeStatsModal" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button></div></div><div id="statsContent"></div><div id="wrongQuestionsList" class="mt-6 border-t pt-4"><h3 class="text-xl font-semibold mb-2">📌 Câu hỏi sai nhiều lần (bộ hiện tại)</h3><div id="wrongQuestionsContainer" class="overflow-x-auto"></div><button id="reviewWrongQuestionsBtn" class="mt-3 bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-sm"><i class="fas fa-book-open"></i> Ôn tập các câu sai này</button></div><canvas id="statsChart" width="400" height="200" class="mt-4"></canvas></div></div>
</div>
<div id="toastMsg" class="toast-notify hidden"></div>

<!-- Custom Confirm/Prompt Modal -->
<div id="customModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-[9999] p-4">
    <div id="customModalContent" class="bg-white rounded-xl shadow-lg max-w-sm w-full p-6 border border-transparent">
        <h3 id="customModalTitle" class="text-lg font-bold mb-3 text-gray-800 dark:text-white">Xác nhận</h3>
        <p id="customModalText" class="text-sm text-gray-600 mb-4"></p>
        <input type="text" id="customModalInput" class="hidden w-full border rounded-lg p-2 mb-4 bg-white text-gray-800 focus:outline-none focus:border-blue-500">
        <div class="flex justify-end gap-3">
            <button id="customModalCancel" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-lg text-sm hover:bg-gray-300 transition">Hủy</button>
            <button id="customModalConfirm" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700 transition">Đồng ý</button>
        </div>
    </div>
</div>

<script>
    // ======================== INDEXEDDB ========================
    const DB_NAME = 'QuestionBanksDB';
    const STORE_BANKS = 'banks';
    const STORE_HISTORY = 'history';
    let db = null;

    async function openDB() { if(db) return db; return new Promise((res,rej)=>{ const req=indexedDB.open(DB_NAME,2); req.onerror=()=>rej(req.error); req.onsuccess=()=>{ db=req.result; res(db); }; req.onupgradeneeded=(e)=>{ const d=e.target.result; if(!d.objectStoreNames.contains(STORE_BANKS)) d.createObjectStore(STORE_BANKS,{keyPath:'id',autoIncrement:true}); if(!d.objectStoreNames.contains(STORE_HISTORY)) d.createObjectStore(STORE_HISTORY,{keyPath:'id',autoIncrement:true}); }; }); }
    async function getAllBanks() { await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE_BANKS,'readonly'); tx.objectStore(STORE_BANKS).getAll().onsuccess=e=>res(e.target.result); }); }
    async function saveBank(name, questions) { await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE_BANKS,'readwrite'); const req=tx.objectStore(STORE_BANKS).add({name,questions,createdAt:new Date().toISOString()}); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); }); }
    async function deleteBank(id) { await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE_BANKS,'readwrite'); tx.objectStore(STORE_BANKS).delete(id).onsuccess=()=>res(); }); }
    async function getBankById(id) { await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE_BANKS,'readonly'); tx.objectStore(STORE_BANKS).get(id).onsuccess=e=>res(e.target.result); }); }
    async function saveHistory(bankId, bankName, totalQuestions, correctCount, wrongDetails, wrongQuestionsText) { await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE_HISTORY,'readwrite'); tx.objectStore(STORE_HISTORY).add({bankId,bankName,totalQuestions,correctCount,wrongCount:totalQuestions-correctCount,wrongDetails,wrongQuestionsText,date:new Date().toISOString(),timestamp:Date.now()}).onsuccess=()=>res(); }); }
    async function getAllHistory() { await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE_HISTORY,'readonly'); tx.objectStore(STORE_HISTORY).getAll().onsuccess=e=>res(e.target.result); }); }
    async function clearAllHistory() { await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction(STORE_HISTORY,'readwrite'); tx.objectStore(STORE_HISTORY).clear().onsuccess=()=>res(); }); }

    // ======================== TIẾN TRÌNH (CHỈ LƯU ID) ========================
    const PROGRESS_KEY = 'exam_progress_v2';
    function saveProgress(progress) { try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch(e) { console.warn(e); } }
    function loadProgress() { const d = localStorage.getItem(PROGRESS_KEY); return d ? JSON.parse(d) : null; }
    function clearProgress() { localStorage.removeItem(PROGRESS_KEY); }

    // ======================== STATE TOÀN CỤC ========================
    let masterQuestions = [];
    let currentQuestions = [];
    let userAnswers = [];
    let flagged = [];
    let submitted = false;
    let scoreDetails = [];
    let timerInterval = null, timeRemainingSeconds = 0, examActive = false, isPaused = false;
    let currentBankId = null, currentBankName = '';
    let statsChart = null;
    let searchDebounceTimer = null;

    // Phân trang & Lazy load
    let displayedCount = 0;
    const BATCH_SIZE = 20;
    let filteredIndices = [];
    let scrollObserver = null;

    // DOM
    const loadingOverlay = document.getElementById('loadingOverlay');
    function showLoading(show, text='Đang xử lý...') { if(show) { document.querySelector('#loadingOverlay div:last-child').innerText = text; loadingOverlay.style.display = 'flex'; } else loadingOverlay.style.display = 'none'; }

    const bankSelect = document.getElementById('bankSelect'), loadSelectedBankBtn = document.getElementById('loadSelectedBankBtn'), deleteBankBtn = document.getElementById('deleteBankBtn');
    const showStatsBtn = document.getElementById('showStatsBtn'), statsModal = document.getElementById('statsModal'), closeStatsModal = document.getElementById('closeStatsModal'), clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const darkModeToggle = document.getElementById('darkModeToggle'), darkModeText = document.getElementById('darkModeText');
    const pauseResumeBtn = document.getElementById('pauseResumeBtn'), excelUpload = document.getElementById('excelUpload');
    const startFullTestBtn = document.getElementById('startFullTestBtn'), startRandomTestBtn = document.getElementById('startRandomTestBtn'), resetExamBtn = document.getElementById('resetExamBtn'), submitBtn = document.getElementById('submitBtn'), showGridBtn = document.getElementById('showGridBtn'), reviewWrongMainBtn = document.getElementById('reviewWrongMainBtn');
    const questionCountInput = document.getElementById('questionCount'), timeMinutesInput = document.getElementById('timeMinutes');
    const questionsContainer = document.getElementById('questionsContainer'), loadMoreTrigger = document.getElementById('loadMoreTrigger'), answeredCountSpan = document.getElementById('answeredCount'), totalQuestionsSpan = document.getElementById('totalQuestionsCount');
    const progressFill = document.getElementById('progressFill'), resultPanel = document.getElementById('resultPanel'), resultContent = document.getElementById('resultContent');
    const uploadStatus = document.getElementById('uploadStatus'), modeInfo = document.getElementById('modeInfo'), reviewWrongBtn = document.getElementById('reviewWrongBtn');
    const goTopBtn = document.getElementById('goTopBtn'), goBottomBtn = document.getElementById('goBottomBtn'), timerDisplay = document.getElementById('timerDisplay');
    const searchInput = document.getElementById('searchInput'), clearSearchBtn = document.getElementById('clearSearchBtn'), questionGridPanel = document.getElementById('questionGridPanel'), questionGrid = document.getElementById('questionGrid'), toastMsg = document.getElementById('toastMsg');
    const reviewWrongQuestionsBtn = document.getElementById('reviewWrongQuestionsBtn'), exportPdfBtn = document.getElementById('exportPdfBtn');

    // Hàm Custom Modal thay thế confirm() và prompt() (Do iFrame bị chặn popup)
    const customModal = document.getElementById('customModal'), customModalText = document.getElementById('customModalText'), customModalInput = document.getElementById('customModalInput'), customModalCancel = document.getElementById('customModalCancel'), customModalConfirm = document.getElementById('customModalConfirm');
    
    function showConfirm(msg, callback) {
        customModalText.innerText = msg;
        customModalInput.classList.add('hidden');
        customModal.classList.remove('hidden'); customModal.classList.add('flex');
        customModalConfirm.onclick = () => { customModal.classList.add('hidden'); customModal.classList.remove('flex'); callback(true); };
        customModalCancel.onclick = () => { customModal.classList.add('hidden'); customModal.classList.remove('flex'); callback(false); };
    }

    function showPrompt(msg, defaultVal, callback) {
        customModalText.innerText = msg;
        customModalInput.value = defaultVal || '';
        customModalInput.classList.remove('hidden');
        customModal.classList.remove('hidden'); customModal.classList.add('flex');
        customModalInput.focus();
        customModalConfirm.onclick = () => { customModal.classList.add('hidden'); customModal.classList.remove('flex'); callback(customModalInput.value); };
        customModalCancel.onclick = () => { customModal.classList.add('hidden'); customModal.classList.remove('flex'); callback(null); };
    }

    function showToast(msg, duration=2500) { 
        toastMsg.innerHTML = msg; 
        toastMsg.classList.remove('hidden'); 
        if(window.toastTimeout) clearTimeout(window.toastTimeout);
        window.toastTimeout = setTimeout(()=>toastMsg.classList.add('hidden'), duration); 
    }

    document.addEventListener('click', (e) => {
        if (!toastMsg.classList.contains('hidden') && !e.target.closest('.hint-btn')) {
            toastMsg.classList.add('hidden');
            if(window.toastTimeout) clearTimeout(window.toastTimeout);
        }
    });

    // Dark mode
    function initDarkMode() { const isDark = localStorage.getItem('darkMode') === 'true'; if(isDark) document.body.classList.add('dark'); darkModeText.innerText = isDark ? 'Sáng' : 'Tối'; darkModeToggle.onclick = () => { document.body.classList.toggle('dark'); const dark = document.body.classList.contains('dark'); localStorage.setItem('darkMode', dark); darkModeText.innerText = dark ? 'Sáng' : 'Tối'; }; }

    // Timer
    function stopTimer() { if(timerInterval) clearInterval(timerInterval); timerInterval=null; }
    function updateTimerDisplay() { const m=Math.floor(timeRemainingSeconds/60), s=timeRemainingSeconds%60; timerDisplay.innerText=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    function startTimer(seconds) { stopTimer(); timeRemainingSeconds = seconds; updateTimerDisplay(); if(!isPaused && examActive && !submitted) timerInterval = setInterval(()=>{ if(!examActive || isPaused || submitted) return; if(timeRemainingSeconds<=1){ stopTimer(); if(!submitted && currentQuestions.length) submitExam(); } else { timeRemainingSeconds--; updateTimerDisplay(); saveProgressToLocal(); } },1000); }
    function pauseExam() { if(!examActive || submitted) return; isPaused=true; stopTimer(); pauseResumeBtn.innerHTML='<i class="fas fa-play"></i> Tiếp tục'; showToast("Đã tạm dừng."); saveProgressToLocal(); }
    function resumeExam() { if(!examActive || submitted) return; isPaused=false; pauseResumeBtn.innerHTML='<i class="fas fa-pause"></i> Tạm dừng'; startTimer(timeRemainingSeconds); showToast("Tiếp tục."); saveProgressToLocal(); }
    pauseResumeBtn.onclick = () => { if(!examActive||submitted) showToast("Chưa có bài thi."); else if(isPaused) resumeExam(); else pauseExam(); };

    function updateProgress() { if(!currentQuestions.length) return; const answered=userAnswers.filter(a=>a&&a.length>0).length; answeredCountSpan.innerText=answered; totalQuestionsSpan.innerText=currentQuestions.length; progressFill.style.width=`${(answered/currentQuestions.length)*100}%`; if(!questionGridPanel.classList.contains('hidden')) renderQuestionGrid(); saveProgressToLocal(); }

    // ======================== RENDER & TÌM KIẾM ========================
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    
    // Loại bỏ dấu tiếng Việt để so khớp chuẩn xác
    function removeAccents(str) {
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
    }

    // Tách văn bản thành các token (từ) và lấy chuỗi chữ cái đầu tiên
    function getInitialsInfo(text) {
        const regex = /([\p{L}\p{N}]+)/gu;
        let match;
        const tokens = [];
        let initials = "";
        while ((match = regex.exec(text)) !== null) {
            const initial = removeAccents(match[1][0]).toLowerCase();
            tokens.push({ index: match.index, end: match.index + match[1].length, initial: initial });
            initials += initial;
        }
        return { tokens, initials };
    }

    // Highlight từ khóa và viết tắt
    function getHighlightedText(text, rawSearch) {
        if (typeof rawSearch !== 'string' || !rawSearch || rawSearch.trim() === '') return escapeHtml(text);
        
        const rawSearchTrimmed = rawSearch.trim().toLowerCase();
        const searchNorm = removeAccents(rawSearchTrimmed);
        const terms = searchNorm.split(/\s+/).filter(t => t);
        
        // 1. Highlight kiểu chữ viết tắt (Acronym) - Kích hoạt khi tìm 1 từ dính liền >= 2 ký tự
        if (terms.length === 1 && terms[0].length >= 2) {
            const acronymTarget = terms[0];
            const { tokens, initials } = getInitialsInfo(text);
            const acrIdx = initials.indexOf(acronymTarget);
            
            if (acrIdx !== -1) {
                const startToken = tokens[acrIdx];
                const endToken = tokens[acrIdx + acronymTarget.length - 1];
                const start = startToken.index;
                const end = endToken.end;
                
                const before = escapeHtml(text.substring(0, start));
                const matchStr = escapeHtml(text.substring(start, end));
                const after = escapeHtml(text.substring(end));
                
                return `${before}<mark class="bg-yellow-300 text-black px-0.5 rounded">${matchStr}</mark>${after}`;
            }
        }
        
        // 2. Highlight kiểu tìm kiếm bình thường (từ không liền kề)
        let resultHtml = escapeHtml(text);
        const rawOriginalTerms = rawSearchTrimmed.split(/\s+/).filter(t => t);
        if (rawOriginalTerms.length > 0) {
            const safeTerms = rawOriginalTerms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            const regex = new RegExp(`(${safeTerms.join('|')})`, 'gi');
            resultHtml = resultHtml.replace(regex, '<mark class="bg-yellow-300 text-black px-0.5 rounded">$1</mark>');
        }
        return resultHtml;
    }

    // Khởi tạo render (Lazy load)
    function initLazyRender(onComplete = null) {
        if (!currentQuestions.length) { 
            questionsContainer.innerHTML = '<div class="text-center text-gray-400 py-10">Chưa có bài thi.</div>'; 
            if(onComplete) onComplete(); return; 
        }

        const rawSearch = searchInput.value.trim().toLowerCase();
        const searchNorm = removeAccents(rawSearch);
        const terms = searchNorm.split(/\s+/).filter(t => t);
        const isAcronymSearch = terms.length === 1 && terms[0].length >= 2;
        const acronymTarget = terms.length === 1 ? terms[0] : "";
        const rawTerms = rawSearch.split(/\s+/).filter(t => t);

        filteredIndices = [];
        
        for (let i = 0; i < currentQuestions.length; i++) {
            const qText = currentQuestions[i].text;
            const qTextLower = qText.toLowerCase();
            
            // 1. Tìm kiếm bình thường
            const matchNormal = rawTerms.length === 0 || rawTerms.every(term => qTextLower.includes(term));
            
            // 2. Tìm kiếm chữ cái đầu
            let matchAcronym = false;
            if (isAcronymSearch && !matchNormal) {
                const { initials } = getInitialsInfo(qText);
                if (initials.includes(acronymTarget)) {
                    matchAcronym = true;
                }
            }

            if (rawTerms.length === 0 || matchNormal || matchAcronym) {
                filteredIndices.push(i);
            }
        }

        questionsContainer.innerHTML = '';
        displayedCount = 0;
        
        // Render đợt 1
        renderNextBatch(rawSearch);

        // Thiết lập Observer cho việc cuộn (Infinite scroll)
        setupScrollObserver(rawSearch);
        
        attachGlobalEvents();
        if(onComplete) onComplete();
    }

    function renderNextBatch(rawSearch) {
        const end = Math.min(displayedCount + BATCH_SIZE, filteredIndices.length);
        if (displayedCount >= end) return;

        const fragment = document.createDocumentFragment();
        for (let i = displayedCount; i < end; i++) {
            const idx = filteredIndices[i];
            const div = document.createElement('div');
            div.innerHTML = generateQuestionHTML(idx, rawSearch);
            fragment.appendChild(div.firstElementChild);
        }
        questionsContainer.appendChild(fragment);
        displayedCount = end;
    }

    function setupScrollObserver(rawSearch) {
        if (scrollObserver) scrollObserver.disconnect();
        
        scrollObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && displayedCount < filteredIndices.length) {
                renderNextBatch(rawSearch);
            }
        }, { rootMargin: '300px' }); 
        
        scrollObserver.observe(loadMoreTrigger);
    }

    function generateQuestionHTML(idx, rawSearch = "") {
        const q=currentQuestions[idx], userChoice=userAnswers[idx]||[], isSubmitted=submitted, checkRes=isSubmitted?checkAnswer(idx):null, isCorrect=isSubmitted?checkRes.correct:false, correctIndices=isSubmitted?checkRes.correctAnswers:[];
        let cardClass=`card-question bg-white rounded-xl shadow-md overflow-hidden border-l-4 ${isSubmitted?(isCorrect?"answer-correct":"answer-wrong"):"border-gray-200"}`;
        let optionsHtml='';
        q.options.forEach((opt,optIdx)=>{
            const isChecked=userChoice.includes(optIdx), inputType=q.type==='multiple'?'checkbox':'radio';
            let extraClass="", badge=false;
            if(isSubmitted && correctIndices.includes(optIdx)) { extraClass="bg-green-100 border-green-300"; badge=true; }
            else if(isSubmitted && isChecked && !correctIndices.includes(optIdx)) extraClass="bg-red-100 border-red-300";
            optionsHtml+=`<label class="flex items-start gap-3 p-3 rounded-lg border ${extraClass} hover:bg-gray-50 transition cursor-pointer mb-2"><input type="${inputType}" name="q${idx}" value="${optIdx}" ${isChecked?"checked":""} ${isSubmitted?"disabled":""} class="mt-1 option-input" data-qidx="${idx}" data-optidx="${optIdx}"><span class="text-gray-700 text-sm flex-1">${escapeHtml(opt)}</span>${badge?'<span class="text-green-600 text-xs font-medium bg-white px-2 py-0.5 rounded-full">✓ Đúng</span>':''}</label>`;
        });
        let feedback='';
        if(isSubmitted && !isCorrect) feedback=`<div class="mt-3 text-sm bg-amber-50 p-2 rounded-lg"><i class="fas fa-info-circle"></i> Đáp án đúng: ${escapeHtml(correctIndices.map(i=>q.options[i]).join('; '))}</div>`;
        else if(isSubmitted && isCorrect) feedback=`<div class="mt-3 text-sm text-green-700"><i class="fas fa-check-circle"></i> Chính xác!</div>`;
        const flagIcon = flagged[idx] ? '<i class="fas fa-flag text-yellow-500"></i>' : '<i class="far fa-flag text-gray-400"></i>';
        
        const highlightedTitle = getHighlightedText(q.text, rawSearch);

        return `<div id="question-${idx}" class="${cardClass}"><div class="p-5"><div class="flex justify-between items-start gap-2 flex-wrap"><h3 class="font-semibold text-gray-800 text-base flex gap-2"><span class="bg-blue-100 text-blue-800 rounded-full min-w-[24px] h-6 inline-flex items-center justify-center text-xs font-bold px-1">${idx+1}</span><span class="flex-1">${highlightedTitle}</span></h3><div class="flex gap-2"><button class="hint-btn text-xs bg-gray-100 hover:bg-gray-200 px-2 py-1 rounded" data-qidx="${idx}"><i class="fas fa-lightbulb"></i> Hint</button><button class="flag-btn text-sm" data-qidx="${idx}">${flagIcon}</button></div></div><div class="mt-3 space-y-1">${optionsHtml}</div>${feedback}</div></div>`;
    }

    function checkAnswer(idx) { const std=currentQuestions[idx].correctIndices, user=userAnswers[idx]||[]; return { correct:std.length===user.length && std.every(v=>user.includes(v)), correctAnswers:std, userAnswers:user }; }
    function setAnswer(qIdx, sel) { if(submitted) { showToast("Đã nộp bài."); return false; } userAnswers[qIdx]=[...sel]; updateProgress(); renderSingleQuestion(qIdx); renderQuestionGrid(); return true; }
    function toggleFlag(qIdx) { if(submitted) return; flagged[qIdx]=!flagged[qIdx]; renderSingleQuestion(qIdx); renderQuestionGrid(); showToast(flagged[qIdx]?"Đã đánh dấu.":"Bỏ đánh dấu."); }
    
    function showHint(qIdx) { 
        const correctText = currentQuestions[qIdx].correctIndices.map(i=>`- ${currentQuestions[qIdx].options[i]}`).join('<br>'); 
        showToast(`💡 <b>Đáp án đúng:</b><br>${correctText}`, 10000); 
    }

    function renderSingleQuestion(idx) {
        const oldDiv = document.getElementById(`question-${idx}`);
        if(oldDiv){ 
            const rawSearch = searchInput.value.trim().toLowerCase();
            const newHtml = generateQuestionHTML(idx, rawSearch); 
            const temp = document.createElement('div'); temp.innerHTML = newHtml; 
            oldDiv.parentNode.replaceChild(temp.firstElementChild, oldDiv); 
        }
    }

    // Event delegation
    function attachGlobalEvents() {
        questionsContainer.removeEventListener('change', handleContainerChange);
        questionsContainer.removeEventListener('click', handleContainerClick);
        questionsContainer.addEventListener('change', handleContainerChange);
        questionsContainer.addEventListener('click', handleContainerClick);
    }
    function handleContainerChange(e) { const inp = e.target; if(inp.classList.contains('option-input')) { const qIdx = parseInt(inp.dataset.qidx); const container = document.getElementById(`question-${qIdx}`); const all = container.querySelectorAll(`.option-input[name="q${qIdx}"]`); let sel=[]; all.forEach(i=>{if(i.checked) sel.push(parseInt(i.dataset.optidx));}); setAnswer(qIdx,sel); } }
    function handleContainerClick(e) { const btn = e.target.closest('.flag-btn'); if(btn) { e.preventDefault(); toggleFlag(parseInt(btn.dataset.qidx)); } const hint = e.target.closest('.hint-btn'); if(hint) { e.preventDefault(); showHint(parseInt(hint.dataset.qidx)); } }

    function renderQuestionGrid() { if(!currentQuestions.length) { questionGrid.innerHTML='<div class="text-gray-400">Chưa có dữ liệu</div>'; return; } let html=''; for(let i=0;i<currentQuestions.length;i++){ let bg='bg-blue-200'; if(userAnswers[i]?.length>0) bg='bg-green-500'; if(flagged[i]) bg='bg-yellow-400'; html+=`<div class="question-grid-item w-10 h-10 rounded-md flex items-center justify-center text-xs font-bold text-white ${bg} shadow-sm cursor-pointer hover:opacity-80" data-qidx="${i}">${i+1}</div>`; } questionGrid.innerHTML=html; document.querySelectorAll('.question-grid-item').forEach(el=>{ el.addEventListener('click',()=>{ const idx=parseInt(el.dataset.qidx); 
        if(!document.getElementById(`question-${idx}`)) {
            searchInput.value = ''; 
            if(clearSearchBtn) clearSearchBtn.classList.add('hidden');
            initLazyRender(()=>{
                while(displayedCount <= idx && displayedCount < filteredIndices.length) renderNextBatch('');
                setTimeout(()=> document.getElementById(`question-${idx}`)?.scrollIntoView({behavior:'smooth',block:'center'}), 100);
            });
        } else {
            document.getElementById(`question-${idx}`)?.scrollIntoView({behavior:'smooth',block:'center'});
        }
        questionGridPanel.classList.add('hidden'); 
    }); }); }

    // Các hàm thi
    function initExam(questionsArray, timeMinutes) { if(!questionsArray.length) { showToast("Chưa có ngân hàng."); return false; } stopTimer(); currentQuestions=[...questionsArray]; userAnswers=Array(currentQuestions.length).fill().map(()=>[]); flagged=Array(currentQuestions.length).fill(false); submitted=false; examActive=true; isPaused=false; pauseResumeBtn.innerHTML='<i class="fas fa-pause"></i> Tạm dừng'; updateProgress(); initLazyRender(); resultPanel.classList.add('hidden'); searchInput.value=''; if(clearSearchBtn) clearSearchBtn.classList.add('hidden'); startTimer(timeMinutes*60); modeInfo.innerText=`Đang thi: ${currentQuestions.length} câu, ${timeMinutes} phút`; renderQuestionGrid(); saveProgressToLocal(); return true; }
    function startFullTest() { if(!masterQuestions.length) showToast("Chưa có bộ câu hỏi."); else initExam(masterQuestions, parseInt(timeMinutesInput.value)||30); }
    function startRandomTest() { if(!masterQuestions.length) showToast("Chưa có bộ câu hỏi."); else { let num=parseInt(questionCountInput.value); if(isNaN(num)||num<=0) num=masterQuestions.length; if(num>masterQuestions.length) num=masterQuestions.length; const shuffled=[...masterQuestions]; for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; } initExam(shuffled.slice(0,num), parseInt(timeMinutesInput.value)||30); } }
    function resetCurrentExam() { if(!currentQuestions.length) showToast("Chưa có bài."); else if(!examActive) showToast("Bài đã nộp."); else { stopTimer(); userAnswers=Array(currentQuestions.length).fill().map(()=>[]); flagged=Array(currentQuestions.length).fill(false); submitted=false; examActive=true; isPaused=false; pauseResumeBtn.innerHTML='<i class="fas fa-pause"></i> Tạm dừng'; updateProgress(); initLazyRender(); resultPanel.classList.add('hidden'); startTimer((parseInt(timeMinutesInput.value)||30)*60); showToast("Đã làm mới."); saveProgressToLocal(); } }
    
    function submitExam() { 
        if(!currentQuestions.length||submitted) return; 
        
        showConfirm("Bạn có chắc muốn nộp bài?", async (yes) => {
            if(!yes) return;
            try {
                stopTimer(); examActive=false; submitted=true; 
                const evalRes = evaluateAll(); scoreDetails=evalRes.details; const percent=(evalRes.correctCount/evalRes.total*100).toFixed(1); 
                
                resultContent.innerHTML=`
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <p class="text-lg font-semibold text-gray-800">✅ Điểm số: ${evalRes.correctCount}/${evalRes.total} (${percent}%)</p>
                        <p class="text-sm text-gray-700 mt-1">Đúng: ${evalRes.correctCount} | Sai: ${evalRes.total-evalRes.correctCount}</p>
                        <div class="w-full bg-gray-200 rounded-full h-2 mt-3">
                            <div class="bg-green-500 h-2 rounded-full" style="width:${percent}%"></div>
                        </div>
                    </div>
                    <div class="mt-3 text-sm italic text-gray-600">💡 Kết quả chi tiết bên dưới.</div>
                `; 
                resultPanel.classList.remove('hidden'); 
                
                // Xoá tìm kiếm khi nộp để xem được toàn bộ kết quả
                searchInput.value = '';
                if(clearSearchBtn) clearSearchBtn.classList.add('hidden');
                
                initLazyRender(() => {
                    while(displayedCount < Math.min(50, filteredIndices.length)) renderNextBatch('');
                    // Dùng setTimeout đảm bảo UI render xong mới scroll
                    setTimeout(() => resultPanel.scrollIntoView({behavior:'smooth',block:'start'}), 150);
                });
                
                const wrongIndices=[], wrongTexts=[]; 
                for(let i=0;i<currentQuestions.length;i++) {
                    if(userAnswers[i]?.length>0 && !scoreDetails[i].correct) { 
                        wrongIndices.push(i); wrongTexts.push(currentQuestions[i].text); 
                    } 
                }
                if (currentBankId) {
                    await saveHistory(currentBankId, currentBankName, currentQuestions.length, evalRes.correctCount, wrongIndices, wrongTexts); 
                }
                showToast("Đã lưu kết quả."); clearProgress(); 
            } catch(err) {
                console.error(err);
                showToast("Lỗi khi nộp bài!");
            }
        });
    }

    function evaluateAll() { let correct=0, details=[]; for(let i=0;i<currentQuestions.length;i++){ const res=checkAnswer(i); details.push({index:i,correct:res.correct,correctIndices:res.correctAnswers,userIndices:res.userAnswers}); if(res.correct) correct++; } return {correctCount:correct, total:currentQuestions.length, details}; }

    // Parse Excel (Đã cải tiến nhận diện linh hoạt & Quét đa Sheet)
    function parseExcelToQuestions(dataBuffer) {
        const wb = XLSX.read(dataBuffer,{type:'array'});
        const qList = []; // Mảng chứa toàn bộ câu hỏi gộp từ tất cả các sheet

        // Lặp qua từng sheet trong file Excel
        for (const sheetName of wb.SheetNames) {
            const sheet = wb.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
            if(!rows || rows.length < 2) continue; // Bỏ qua sheet rỗng hoặc quá ngắn
            
            let headerIdx = -1;
            let colMap = {question:-1, answer:-1, type:-1, options:[]};

            // 1. Tìm dòng tiêu đề linh hoạt trên sheet hiện tại
            for(let i=0; i<Math.min(rows.length,30); i++){
                const row = rows[i]; 
                if(!row) continue;
                
                const rowStr = row.map(c => String(c || "").trim().toLowerCase());
                const rowFullText = rowStr.join(" ");

                if((rowFullText.includes("câu hỏi") || rowFullText.includes("nội dung")) && rowFullText.includes("đáp án")){
                    headerIdx = i;
                    for(let j=0; j<rowStr.length; j++){
                        const cell = rowStr[j];
                        if(cell === "câu hỏi" || cell.includes("nội dung câu hỏi")) colMap.question = j;
                        else if(cell === "đáp án" || cell.includes("trả lời")) colMap.answer = j;
                        else if(cell.includes("loại câu hỏi") || cell === "loại" || cell === "type") colMap.type = j;
                        else if(cell.includes("phương án") || cell.includes("lựa chọn") || cell.includes("option") || /^[a-f]$/.test(cell) || /^đáp án [a-f]$/.test(cell)) {
                            colMap.options.push(j);
                        }
                    }
                    break;
                }
            }

            // Nếu sheet này không có cấu trúc câu hỏi hợp lệ -> Tự động bỏ qua sheet này (ví dụ bỏ qua sheet Kết cấu)
            if(headerIdx === -1 || colMap.question === -1 || colMap.answer === -1 || colMap.options.length === 0) {
                continue; 
            }

            // 2. Trích xuất câu hỏi từ sheet hợp lệ
            for(let i=headerIdx+1; i<rows.length; i++){
                const row = rows[i]; 
                if(!row) continue;
                
                const qText = String(row[colMap.question] || "").trim();
                if(!qText) continue;

                let qType = 'single';
                let typeRaw = colMap.type !== -1 ? String(row[colMap.type] || "").toUpperCase() : "";
                if(typeRaw.includes('MC') || typeRaw.includes('MA')) qType = 'multiple';
                else if(typeRaw.includes('SC') || typeRaw.includes('SA')) qType = 'single';

                const opts = [];
                colMap.options.forEach(colIdx => {
                    const optVal = String(row[colIdx] || "").trim();
                    if(optVal !== "") opts.push(optVal);
                });
                if(opts.length === 0) continue;

                let ansRaw = String(row[colMap.answer] || "").trim().toUpperCase();
                let ansIdx = [];
                const ansParts = ansRaw.split(/[,;]+/).map(s => s.trim()).filter(s => s);
                
                ansParts.forEach(part => {
                    if(/^\d+$/.test(part)) { 
                        const idx = parseInt(part) - 1;
                        if(idx >= 0 && idx < opts.length) ansIdx.push(idx);
                    } else if(/^[A-Z]$/.test(part)) { 
                        const idx = part.charCodeAt(0) - 65; 
                        if(idx >= 0 && idx < opts.length) ansIdx.push(idx);
                    }
                });

                if(qType === 'single' && ansIdx.length > 1) qType = 'multiple';
                if(ansIdx.length === 0) continue;

                // Thêm vào danh sách câu hỏi tổng
                qList.push({text: qText, options: opts, correctIndices: ansIdx, type: qType});
            }
        }

        // 3. Sau khi duyệt hết tất cả các sheet
        if(qList.length === 0) throw new Error("Không nhận diện được câu hỏi hợp lệ nào từ tất cả các sheet trong file.");
        return qList;
    }

    async function uploadAndSaveFile(file) { 
        showLoading(true, "Đang đọc file Excel..."); 
        try { 
            const data = await new Promise((res,rej)=>{ const reader=new FileReader(); reader.onload=e=>res(new Uint8Array(e.target.result)); reader.onerror=rej; reader.readAsArrayBuffer(file); }); 
            const parsed = parseExcelToQuestions(data); 
            showLoading(false);
            
            showPrompt("Nhập tên bộ câu hỏi:", file.name.replace(/\.(xlsx|xls)$/i,''), async (name) => {
                if(!name) { showToast("Đã hủy lưu bộ câu hỏi."); return; }
                showLoading(true, "Đang lưu bộ câu hỏi...");
                try {
                    await saveBank(name, parsed); 
                    await refreshBankDropdown(); 
                    uploadStatus.innerHTML = `✅ Đã lưu bộ "${name}" với ${parsed.length} câu.`; 
                    showToast(`Đã lưu bộ "${name}"`); 
                } catch(err) {
                    uploadStatus.innerHTML = `❌ ${err.message}`; showToast(err.message);
                } finally {
                    showLoading(false);
                }
            });
        } catch(err) { 
            showLoading(false);
            uploadStatus.innerHTML = `❌ ${err.message}`; 
            showToast(err.message); 
        } 
    }

    async function refreshBankDropdown() { const banks = await getAllBanks(); bankSelect.innerHTML = '<option value="">-- Chọn bộ câu hỏi --</option>'; banks.forEach(b=>{ const opt=document.createElement('option'); opt.value=b.id; opt.textContent=`${b.name} (${b.questions.length} câu)`; bankSelect.appendChild(opt); }); if(currentBankId) bankSelect.value = currentBankId; }
    async function loadBankById(id){ const bank = await getBankById(id); if(!bank) return false; masterQuestions=bank.questions; currentBankId=bank.id; currentBankName=bank.name; currentBankInfo.innerText=`Đã tải: ${bank.name} (${bank.questions.length} câu)`; stopTimer(); currentQuestions=[]; userAnswers=[]; flagged=[]; submitted=false; examActive=false; updateProgress(); initLazyRender(); resultPanel.classList.add('hidden'); modeInfo.innerText=`Đã tải "${bank.name}". Hãy chọn hình thức thi.`; showToast(`Đã tải bộ "${bank.name}"`); clearProgress(); return true; }
    
    function deleteSelectedBank(){ 
        const id=bankSelect.value; 
        if(!id){ showToast("Chọn bộ cần xóa."); return; } 
        showConfirm("Xóa bộ câu hỏi này?", async (yes) => {
            if(!yes) return;
            await deleteBank(parseInt(id)); 
            await refreshBankDropdown(); 
            if(currentBankId==id){ masterQuestions=[]; currentBankId=null; currentBankName=''; currentBankInfo.innerText=''; stopTimer(); currentQuestions=[]; userAnswers=[]; flagged=[]; submitted=false; examActive=false; updateProgress(); initLazyRender(); resultPanel.classList.add('hidden'); modeInfo.innerText=''; } 
            showToast("Đã xóa.");
        }); 
    }

    // Báo cáo chi tiết
    async function showStatistics() {
        showLoading(true, "Đang tải báo cáo...");
        try {
            const history = await getAllHistory();
            const statsContent = document.getElementById('statsContent');
            const wrongContainer = document.getElementById('wrongQuestionsContainer');
            if(history.length===0){ statsContent.innerHTML='<p class="text-gray-500">Chưa có dữ liệu lịch sử.</p>'; wrongContainer.innerHTML='<p class="text-gray-500">Chưa có câu sai nào.</p>'; statsModal.classList.remove('hidden'); statsModal.classList.add('flex'); return; }
            const byBank={};
            for(const h of history){
                if(!byBank[h.bankId]) byBank[h.bankId]={bankName:h.bankName, attempts:[], totalQuestions:h.totalQuestions, wrongCounts:[]};
                byBank[h.bankId].attempts.push(h); byBank[h.bankId].wrongCounts.push(h.wrongCount);
            }
            let html='<div class="space-y-4">';
            for(const id in byBank){
                const b=byBank[id]; const avg=(b.wrongCounts.reduce((a,c)=>a+c,0)/b.attempts.length).toFixed(1);
                html+=`<div class="border rounded-lg p-3"><h3 class="font-bold text-lg">📘 ${b.bankName}</h3><p>Số lần ôn: ${b.attempts.length}</p><p>Trung bình sai: ${avg}/${b.totalQuestions}</p><p>Lần gần nhất: ${new Date(b.attempts[b.attempts.length-1].date).toLocaleString()}</p></div>`;
            }
            html+='</div>';
            statsContent.innerHTML=html;
            const filteredHistory = history.filter(h => h.bankId === currentBankId);
            const wrongCountMap = new Map();
            for(const h of filteredHistory){
                if(h.wrongQuestionsText){
                    for(const txt of h.wrongQuestionsText){
                        const key = `${h.bankId}|${txt}`;
                        if(wrongCountMap.has(key)) wrongCountMap.get(key).count++;
                        else wrongCountMap.set(key, { text: txt, count: 1, bankId: h.bankId, bankName: h.bankName });
                    }
                }
            }
            const sortedWrong = Array.from(wrongCountMap.values()).sort((a,b)=>b.count - a.count);
            if(sortedWrong.length===0){
                wrongContainer.innerHTML='<p class="text-gray-500">Không có câu sai nào trong bộ hiện tại.</p>';
            } else {
                let tableHtml = `<table class="wrong-table w-full text-sm border-collapse"><thead><tr><th>#</th><th>Nội dung câu hỏi</th><th>Số lần sai</th><th>Hành động</th></tr></thead><tbody>`;
                sortedWrong.forEach((item, idx) => {
                    tableHtml += `<tr><td>${idx+1}</td><td>${escapeHtml(item.text)}</td><td>${item.count}</td><td><button class="review-wrong-item-btn bg-blue-500 hover:bg-blue-600 text-white px-2 py-1 rounded text-xs" data-text="${escapeHtml(item.text)}">Xem lại</button></td></tr>`;
                });
                tableHtml += `</tbody></table>`;
                wrongContainer.innerHTML = tableHtml;
                document.querySelectorAll('.review-wrong-item-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const questionText = btn.getAttribute('data-text');
                        const found = masterQuestions.find(q => q.text === questionText);
                        if(found) {
                            initExam([found], parseInt(timeMinutesInput.value)||30);
                            statsModal.classList.add('hidden');
                            showToast(`Đang ôn tập câu: ${questionText.substring(0, 80)}...`);
                        } else {
                            showToast("Không tìm thấy câu hỏi trong bộ hiện tại.");
                        }
                    });
                });
            }
            const ctx = document.getElementById('statsChart').getContext('2d');
            if(statsChart) statsChart.destroy();
            const dates=history.slice(-10).map(h=>new Date(h.date).toLocaleDateString());
            const scores=history.slice(-10).map(h=>Math.round(h.correctCount/h.totalQuestions*100));
            statsChart = new Chart(ctx, { type:'line', data:{ labels:dates, datasets:[{ label:'Tỷ lệ đúng (%)', data:scores, borderColor:'blue', tension:0.1 }] }, options:{ responsive:true } });
            statsModal.classList.remove('hidden'); statsModal.classList.add('flex');
        } finally { showLoading(false); }
    }

    // Xuất Báo cáo chuẩn
    function exportToPDF() {
        if(!submitted) { showToast("Hãy nộp bài trước."); return; }
        showLoading(true, "Đang chuẩn bị báo cáo...");
        
        try {
            const correctCount = scoreDetails.filter(d=>d.correct).length;
            const percent = (correctCount / currentQuestions.length * 100).toFixed(1);
            
            const canvasChart = document.createElement('canvas');
            canvasChart.width = 400; canvasChart.height = 200;
            const ctx = canvasChart.getContext('2d');
            new Chart(ctx, { type: 'doughnut', data: { labels: ['Đúng', 'Sai'], datasets: [{ data: [correctCount, currentQuestions.length - correctCount], backgroundColor: ['#22c55e', '#ef4444'] }] }, options: { animation: false, responsive: false, plugins: { legend: { position: 'top' } } } });
            const chartImg = canvasChart.toDataURL();

            let printWindow = window.open('', '_blank');
            let html = `
            <!DOCTYPE html>
            <html lang="vi">
            <head>
                <meta charset="UTF-8">
                <title>Báo cáo kết quả thi</title>
                <style>
                    body { font-family: Arial, sans-serif; padding: 20px; color: #000; background: #fff; line-height: 1.5; }
                    h1 { color: #1e40af; }
                    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
                    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
                    th { background-color: #f2f2f2; }
                    .correct { color: #166534; font-weight: bold; }
                    .wrong { color: #991b1b; font-weight: bold; }
                    img { max-width: 300px; margin-bottom: 20px; }
                    @media print {
                        body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                        table { page-break-inside: auto; }
                        tr { page-break-inside: avoid; page-break-after: auto; }
                        thead { display: table-header-group; }
                    }
                </style>
            </head>
            <body>
                <h1>Báo cáo kết quả thi</h1>
                <p><strong>Bộ câu hỏi:</strong> ${currentBankName}</p>
                <p><strong>Ngày thi:</strong> ${new Date().toLocaleString()}</p>
                <p><strong>Điểm số:</strong> ${correctCount}/${currentQuestions.length} (${percent}%)</p>
                <img src="${chartImg}" alt="Biểu đồ kết quả" />
                <hr/>
                <h3>Chi tiết từng câu hỏi</h3>
                <table>
                    <thead>
                        <tr>
                            <th style="width:5%">STT</th>
                            <th style="width:40%">Nội dung</th>
                            <th style="width:25%">Đáp án đã chọn</th>
                            <th style="width:20%">Đáp án đúng</th>
                            <th style="width:10%">Kết quả</th>
                        </tr>
                    </thead>
                    <tbody>`;
            
            for(let i=0; i<currentQuestions.length; i++) {
                const q = currentQuestions[i];
                const userAns = userAnswers[i] || [];
                const userText = userAns.length ? userAns.map(a => q.options[a]).join('<br>') : '(Chưa trả lời)';
                const correctText = q.correctIndices.map(i => q.options[i]).join('<br>');
                const status = scoreDetails[i].correct ? 'Đúng' : (userAns.length ? 'Sai' : 'Chưa trả lời');
                const statusClass = scoreDetails[i].correct ? 'correct' : 'wrong';
                
                html += `<tr>
                    <td>${i+1}</td>
                    <td>${escapeHtml(q.text)}</td>
                    <td>${userText}</td>
                    <td>${correctText}</td>
                    <td class="${statusClass}">${status}</td>
                </tr>`;
            }

            html += `</tbody></table></body></html>`;
            printWindow.document.open();
            printWindow.document.write(html);
            printWindow.document.close();

            setTimeout(() => {
                showLoading(false);
                printWindow.print();
            }, 500);

        } catch(e) {
            console.error(e); 
            showToast("Lỗi xuất báo cáo: " + e.message);
            showLoading(false);
        }
    }

    async function reviewWrongQuestions() {
        const history = await getAllHistory();
        if(history.length===0){ showToast("Chưa có lịch sử để ôn tập."); return; }
        const currentBankWrongTexts = new Set();
        for(const h of history){
            if(h.bankId === currentBankId && h.wrongQuestionsText){
                h.wrongQuestionsText.forEach(txt => currentBankWrongTexts.add(txt));
            }
        }
        if(currentBankWrongTexts.size === 0){ showToast("Không có câu sai nào trong bộ hiện tại để ôn tập."); return; }
        const wrongQuestions = masterQuestions.filter(q => currentBankWrongTexts.has(q.text));
        if(wrongQuestions.length === 0){ showToast("Không tìm thấy câu hỏi tương ứng."); return; }
        initExam(wrongQuestions, parseInt(timeMinutesInput.value)||30);
        statsModal.classList.add('hidden');
        showToast(`Đã tạo bài ôn tập với ${wrongQuestions.length} câu sai.`);
    }

    function clearHistory() { 
        showConfirm("Xóa toàn bộ lịch sử?", async (yes) => {
            if(!yes) return;
            await clearAllHistory(); 
            showToast("Đã xóa lịch sử."); 
            if(statsModal.classList.contains('flex')) statsModal.classList.add('hidden'); 
        }); 
    }

    // Khởi tạo và sự kiện
    async function init() { await openDB(); await refreshBankDropdown(); initDarkMode(); const restored = await restoreProgress(); if(!restored){ const banks=await getAllBanks(); if(banks.length) await loadBankById(banks[0].id); } setupSearchDebounce(); attachGlobalEvents(); }
    
    function setupSearchDebounce() { 
        searchInput.addEventListener('input', () => { 
            if(searchInput.value.length > 0) clearSearchBtn.classList.remove('hidden');
            else clearSearchBtn.classList.add('hidden');

            if(searchDebounceTimer) clearTimeout(searchDebounceTimer); 
            searchDebounceTimer = setTimeout(()=>{ initLazyRender(); }, 300); 
        }); 

        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            initLazyRender();
        });
    }

    excelUpload.addEventListener('change',e=>{ if(e.target.files[0]) uploadAndSaveFile(e.target.files[0]); e.target.value = ''; });
    loadSelectedBankBtn.addEventListener('click',async()=>{ const id=bankSelect.value; if(id) await loadBankById(parseInt(id)); });
    deleteBankBtn.addEventListener('click',deleteSelectedBank);
    startFullTestBtn.addEventListener('click',startFullTest);
    startRandomTestBtn.addEventListener('click',startRandomTest);
    resetExamBtn.addEventListener('click',resetCurrentExam);
    submitBtn.addEventListener('click',()=>{ if(currentQuestions.length && !submitted) submitExam(); else showToast("Chưa có bài hoặc đã nộp."); });
    showGridBtn.addEventListener('click',()=>{ if(currentQuestions.length){ questionGridPanel.classList.toggle('hidden'); if(!questionGridPanel.classList.contains('hidden')) renderQuestionGrid(); } else showToast("Chưa có bài thi."); });
    goTopBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
    goBottomBtn.addEventListener('click',()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}));
    
    reviewWrongBtn.addEventListener('click',()=>{ 
        if(!submitted) showToast("Hãy nộp bài trước."); 
        else { 
            const wrongs=scoreDetails.filter(d=>!d.correct).map(d=>d.index); 
            if(wrongs.length) {
                // Phải đảm bảo câu bị sai đã được render
                if(!document.getElementById(`question-${wrongs[0]}`)) {
                    initLazyRender(() => {
                        while(displayedCount <= wrongs[0] && displayedCount < filteredIndices.length) renderNextBatch('');
                        setTimeout(() => document.getElementById(`question-${wrongs[0]}`)?.scrollIntoView({behavior:'smooth',block:'center'}), 100);
                    });
                } else {
                    document.getElementById(`question-${wrongs[0]}`)?.scrollIntoView({behavior:'smooth',block:'center'});
                }
            } 
        } 
    });
    
    showStatsBtn.addEventListener('click',showStatistics);
    closeStatsModal.addEventListener('click',()=>statsModal.classList.add('hidden'));
    window.addEventListener('click',(e)=>{ if(e.target===statsModal) statsModal.classList.add('hidden'); });
    reviewWrongQuestionsBtn.addEventListener('click', reviewWrongQuestions);
    reviewWrongMainBtn.addEventListener('click', reviewWrongQuestions);
    exportPdfBtn.addEventListener('click', exportToPDF);
    clearHistoryBtn.addEventListener('click', clearHistory);
    init();
</script>
</body>
</html>
